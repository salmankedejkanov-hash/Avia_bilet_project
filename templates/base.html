<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Airline Booking System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Airline System
        </a>

        <div>

            <a class="btn btn-light" href="/flights/">
                Flights
            </a>

            <a class="btn btn-light" href="/bookings/">
                Bookings
            </a>

            {% if user.is_authenticated %}

                <a class="btn btn-warning" href="/accounts/logout/">
                    Logout
                </a>

            <a
                class="btn btn-info"
                href="/accounts/profile/"
            >
                Profile
            </a>

            {% else %}

                <a class="btn btn-success" href="/accounts/login/">
                    Login
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>

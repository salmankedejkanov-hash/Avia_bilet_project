<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Avia Project</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
        }

        /* NAVBAR */
        .navbar {
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        /* BUTTON ANIMATION */
        .btn-anim {
            transition: all 0.3s ease;
        }

        .btn-anim:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* CARDS */
        .card {
            border: none;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        /* FADE IN */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/flights/">✈ Avia</a>

    <div class="ms-auto d-flex gap-2">

        {% if user.is_authenticated %}
            <a href="/bookings/my/" class="btn btn-warning btn-anim">Мои бронирования</a>
            <a href="/accounts/logout/" class="btn btn-danger btn-anim">Выход</a>
        {% else %}
            <a href="/accounts/login/" class="btn btn-outline-light btn-anim">Вход</a>
            <a href="/accounts/register/" class="btn btn-success btn-anim">Регистрация</a>
        {% endif %}

    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

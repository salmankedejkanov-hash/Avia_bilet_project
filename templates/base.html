{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkyLine</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container py-3">

        <a class="navbar-brand fw-bold" href="/">SkyLine</a>

        <div class="d-flex gap-2">

            <a class="btn btn-outline-light" href="/flights/">Рейсы</a>

            {% if user.is_authenticated %}

                <a class="btn btn-info" href="/bookings/my/">Мои билеты</a>
                <a class="btn btn-warning" href="/accounts/profile/">Профиль</a>
                <a class="btn btn-danger" href="/accounts/logout/">Выйти</a>

            {% else %}

                <a class="btn btn-success" href="/accounts/login/">Авторизация</a>
                <a class="btn btn-primary" href="/accounts/register/">Регистрация</a>

            {% endif %}

        </div>

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>

{% extends 'base.html' %}

{% block content %}

<h1>Мои билеты</h1>

{% for b in bookings %}

<div class="card p-3 mb-2">

    <h4>
        {{ b.flight.departure_airport.city }}
        →
        {{ b.flight.arrival_airport.city }}
    </h4>

    <p>Цена: {{ b.flight.price }}</p>

</div>

{% empty %}

<p>У вас нет билетов</p>

{% endfor %}

{% endblock %}

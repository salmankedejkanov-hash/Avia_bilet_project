{% extends 'base.html' %}

{% block content %}

<h1>Мои бронирования</h1>

{% for b in bookings %}
<div class="card">
    <h3>{{ b.flight.origin }} → {{ b.flight.destination }}</h3>
    <p>{{ b.full_name }}</p>

    <a href="{% url 'cancel_booking' b.id %}">
        Отменить
    </a>
</div>
{% empty %}
<p>Нет бронирований</p>
{% endfor %}

{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <title>Мои бронирования</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<a href="/bookings/cancel/{{ b.id }}/" class="btn btn-danger btn-sm">
    Отменить
</a>

<a href="/bookings/ticket/{{ b.id }}/" class="btn btn-primary btn-sm">
    Скачать билет
</a>

<body class="container mt-4">

<h1>Мои бронирования 🎟</h1>

<a href="/flights/" class="btn btn-secondary mb-3">← Назад к рейсам</a>

{% for b in bookings %}
    <div class="card p-3 mb-3">
        <h4>{{ b.flight.origin }} → {{ b.flight.destination }}</h4>

        <p>Цена: {{ b.flight.price }} $</p>
        <p>Дата брони: {{ b.created_at }}</p>
        <p>Статус: {{ b.status }}</p>

        <a href="/flights/{{ b.flight.id }}/" class="btn btn-primary">
            Посмотреть рейс
        </a>
    </div>
{% empty %}
    <p>У вас пока нет бронирований</p>
{% endfor %}

</body>
</html>

{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-lg border-0 animation-fade">

            <div class="card-body p-5 text-center">

                <img
                    src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                    width="120"
                    class="mb-4"
                >

                <h2>

                    {{ user.username }}

                </h2>

                <p class="text-muted">

                    {{ user.email }}

                </p>

                <hr>

                <a
                    href="/bookings/my/"
                    class="btn btn-primary"
                >
                    My Tickets
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-lg border-0 animation-fade">

            <div class="card-body p-5">

                <h1 class="text-center mb-4">

                    Create Account

                </h1>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-success w-100 btn-lg"
                    >
                        Register
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}

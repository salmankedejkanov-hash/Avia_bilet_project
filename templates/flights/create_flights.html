<!DOCTYPE html>
{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-lg border-0">

            <div class="card-body p-5">

                <h1 class="mb-4">

                    Добавить рейс

                </h1>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Сохранить
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
